spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: Asia/Riyadh

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      timeout: 3000ms

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_SIZE_MB:50}MB
      max-request-size: ${UPLOAD_MAX_SIZE_MB:50}MB

server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  health:
    mail:
      enabled: false

app:
  jwt:
    secret: ${JWT_SECRET}
    expiry-hours: ${JWT_EXPIRY_HOURS:8}
    refresh-expiry-days: ${JWT_REFRESH_EXPIRY_DAYS:7}
  upload:
    path: ${UPLOAD_PATH:/app/uploads}
    allowed-extensions: ${ALLOWED_EXTENSIONS:jpg,jpeg,png,pdf,doc,docx}
  sla:
    critical: ${SLA_CRITICAL_HOURS:4}
    high: ${SLA_HIGH_HOURS:8}
    medium: ${SLA_MEDIUM_HOURS:24}
    low: ${SLA_LOW_HOURS:48}
  base-url: ${APP_BASE_URL}
  # Public ticket status page: OFF in production unless explicitly enabled (needs X-Real-IP from the proxy)
  public-status:
    enabled: ${PUBLIC_STATUS_ENABLED:false}
    rate-limit-per-minute: ${PUBLIC_STATUS_RATE_LIMIT_PER_MINUTE:30}
    link-ttl-days: ${PUBLIC_STATUS_LINK_TTL_DAYS:30}
  # Purchase orders above this total need a manager approval (empty = no limit)
  procurement:
    manager-approval-limit: ${PROCUREMENT_MANAGER_APPROVAL_LIMIT:}
  # External channels are off by default; SMTP host/credentials are spring.mail.* (MAIL_* variables)
  notifications:
    email:
      enabled: ${NOTIFY_EMAIL_ENABLED:false}
      from: ${MAIL_FROM:SMMS <noreply@smms.local>}
      subject-prefix: "[SMMS] "
    sms:
      enabled: ${NOTIFY_SMS_ENABLED:false}
      url: ${SMS_URL:}
      token: ${SMS_TOKEN:}
      sender-id: ${SMS_SENDER_ID:SMMS}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.smms: INFO
  file:
    name: ${LOG_PATH:/app/logs}/smms.log
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 30

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: Asia/Riyadh

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      timeout: 3000ms

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_SIZE_MB:50}MB
      max-request-size: ${UPLOAD_MAX_SIZE_MB:50}MB

server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

app:
  jwt:
    secret: ${JWT_SECRET}
    expiry-hours: ${JWT_EXPIRY_HOURS:8}
    refresh-expiry-days: ${JWT_REFRESH_EXPIRY_DAYS:7}
  upload:
    path: ${UPLOAD_PATH:/app/uploads}
    allowed-extensions: ${ALLOWED_EXTENSIONS:jpg,jpeg,png,pdf,doc,docx}
  sla:
    critical: ${SLA_CRITICAL_HOURS:4}
    high: ${SLA_HIGH_HOURS:8}
    medium: ${SLA_MEDIUM_HOURS:24}
    low: ${SLA_LOW_HOURS:48}
  base-url: ${APP_BASE_URL}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.smms: INFO
  file:
    name: ${LOG_PATH:/app/logs}/smms.log
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 30

# Access log without query strings: the logged URI is cut at "?" or "%3F", so one-time tickets or tokens that a
# client wrongly puts in a URL (e.g. /ws/notifications?ticket=...) are never written to disk.
# The supported WebSocket flow sends the ticket as a Sec-WebSocket-Protocol value, which is not logged.
map $request_uri $smms_log_uri {
    # keep only the path: cut at the first "?" or encoded "?" (%3F), whatever follows is never logged
    "~^(?<p>[^?]*?)(?:\?|%3[fF]).*$"  $p;
    default                            $request_uri;
}
log_format smms_safe '$remote_addr - [$time_local] "$request_method $smms_log_uri $server_protocol" '
                     '$status $body_bytes_sent "$http_user_agent"';

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log smms_safe;

    client_max_body_size 50M;

    # Health check
    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # API proxy → Spring Boot backend
    location /api/ {
        proxy_pass         http://smms_backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # WebSocket (real-time notifications) → Spring Boot backend
    location /ws/ {
        # The supported flow passes the ticket as a Sec-WebSocket-Protocol value. A query string
        # here can only be a mistake (or a probe); reject it before proxying so that neither the
        # access log nor the upstream-error log (which prints the full request line) records it.
        # raw request line: also catches an encoded "?" (%3F) that $uri/$args would hide
        if ($request_uri ~* "(\?|%3f)") { return 400; }

        proxy_pass         http://smms_backend:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;
    }

    # File uploads
    location /uploads/ {
        # Attachments are not served as static files (access-controlled API only)
        return 404;
    }

    # Everything else → Next.js frontend server
    location / {
        proxy_pass         http://smms_frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 60s;
    }
}

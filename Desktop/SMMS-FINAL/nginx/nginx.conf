server {
    listen 80;
    server_name _;

    client_max_body_size 50M;

    # Health check
    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # API proxy → Spring Boot backend
    location /api/ {
        proxy_pass         http://smms_backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # WebSocket (real-time notifications) → Spring Boot backend
    location /ws/ {
        proxy_pass         http://smms_backend:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;
    }

    # File uploads
    location /uploads/ {
        # Attachments are not served as static files (access-controlled API only)
        return 404;
    }

    # Everything else → Next.js frontend server
    location / {
        proxy_pass         http://smms_frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 60s;
    }
}

# Secret scanning config (gitleaks). CI: .github/workflows/secret-scan.yml
title = "SMMS gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Documentation examples and the generated-secret placeholder"
paths = [
  '''^\.claude/skills/''',
]
regexes = [
  '''__GENERATED_BY_SETUP__''',
  '''CHANGE_ME''',
]
